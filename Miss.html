 <!DOCTYPE html>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@300;500;800;900&display=swap');

        :root {
            --primary: #00f2ff;
            --secondary: #7000ff;
            --bg: #030712;
            --card-bg: rgba(30, 41, 59, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Tajawal', sans-serif; }

        body { 
            background: var(--bg); 
            color: #fff;
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* خلفية ضوئية متحركة */
        .glow-bg {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #1e1b4b 0%, #030712 100%);
            z-index: -1;
        }

        header {
            padding: 80px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 4rem;
            font-weight: 900;
            background: linear-gradient(to right, var(--primary), #fff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 15px;
        }

        .container { max-width: 1400px; margin: auto; padding: 20px; }

        .provinces-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 40px 20px;
            text-align: center;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
        }

        .card:hover {
            transform: translateY(-10px);
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(0, 242, 255, 0.2);
        }

        .card h2 { font-size: 2.8rem; margin-bottom: 25px; font-weight: 900; }

        .btn {
            background: transparent;
            color: var(--primary);
            border: 2px solid var(--primary);
            padding: 10px 30px;
            border-radius: 50px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }

        .btn:hover { background: var(--primary); color: #000; }

        /* نافذة المعلومات */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            padding: 20px;
        }

        .modal-content {
            background: #0f172a;
            max-width: 1000px;
            height: 90vh;
            margin: auto;
            border-radius: 30px;
            padding: 40px;
            overflow-y: auto;
            border: 1px solid var(--secondary);
            position: relative;
        }

        .future-box {
            background: linear-gradient(90deg, #4338ca, #6d28d9);
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 30px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 15px;
        }

        .info-item {
            background: rgba(255,255,255,0.05);
            padding: 15px;
            border-radius: 12px;
            border-right: 4px solid var(--primary);
            font-size: 1rem;
        }

        .close-btn { color: #ff4757; font-size: 3rem; cursor: pointer; float: left; }
    </style>
</head>

            const cityData = provinces[city];
            document.getElementById('mTitle').innerText = city;
            document.getElementById('mFuture').innerText = cityData.future;

            infoGrid.innerHTML = '';

            document.getElementById('modal').style.display = 'none';
            document.body.style.overflow = 'auto';

</html>
